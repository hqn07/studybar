name: StudyBar
options:
  bundleIdPrefix: com.studybar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # Native LaTeX math typesetter (iosMath port) — renders $…$ to an image
  # synchronously, for in-place inline math in the Notes editor.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    from: "1.5.0"
settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  StudyBar:
    type: application
    platform: macOS
    dependencies:
      - package: SwiftMath
    sources:
      - path: Sources/StudyBar
        excludes:
          - "Resources/katex/**"
      # KaTeX bundled as a folder reference so katex.min.css can resolve fonts/ at a
      # relative path inside the app bundle (offline LaTeX rendering).
      - path: Sources/StudyBar/Resources/katex
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studybar.StudyBar
        PRODUCT_NAME: StudyBar
        INFOPLIST_FILE: Sources/StudyBar/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
